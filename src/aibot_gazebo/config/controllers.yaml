# ros2_control configuration for STAR1 upper-body teleop in Gazebo Harmonic.
#
# Controller choice: position_controllers/JointGroupPositionController (forward_command_controller
# family) instead of joint_trajectory_controller/JointTrajectoryController.
#   * Teleop streams a fresh absolute target every 33 ms (30 Hz). A forward controller writes it to
#     the hardware on the next 5 ms update: zero added latency, no goal/tolerance bookkeeping.
#   * JTC would treat each message as a new trajectory: it needs time_from_start >= one message
#     period (adds >= 33 ms delay), re-plans/preempts 30 times a second and can stutter or abort
#     on tolerance violations. Its strengths (smooth spline execution of planned motions) are not
#     needed here; smoothing happens in retarget_node (One-Euro filter + velocity limiting) and in
#     the first-order response of the gz position servo below.
#
# Gains: gz_ros2_control's position interface is a velocity servo, not a PID:
#     v_cmd = position_proportional_gain * (q_cmd - q) * update_rate     (clipped by URDF limits)
# so the joint follows a first-order lag with time constant  tau = 1 / (gain * update_rate).
# gain 0.2 at 200 Hz -> tau = 25 ms: smooths 30 Hz command steps, still well below human
# reaction time, and cannot overshoot (gain <= 1). Raise the gain for snappier, more jerky motion.

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    waist_controller:
      type: position_controllers/JointGroupPositionController
    head_controller:
      type: position_controllers/JointGroupPositionController
    left_arm_controller:
      type: position_controllers/JointGroupPositionController
    right_arm_controller:
      type: position_controllers/JointGroupPositionController
    left_hand_controller:
      type: position_controllers/JointGroupPositionController
    right_hand_controller:
      type: position_controllers/JointGroupPositionController

gz_ros_control:
  ros__parameters:
    position_proportional_gain: 0.2
    hold_joints: true  # keep joints at their last position when no controller commands them

waist_controller:
  ros__parameters:
    joints:
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint

head_controller:
  ros__parameters:
    joints:
      - neck_yaw_joint
      - neck_pitch_joint

left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_arm_yaw_joint
      - left_elbow_pitch_joint
      - left_elbow_yaw_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_arm_yaw_joint
      - right_elbow_pitch_joint
      - right_elbow_yaw_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint

left_hand_controller:
  ros__parameters:
    joints:
      - left_hand_thumb_bend_joint
      - left_hand_thumb_rota_joint1
      - left_hand_thumb_rota_joint2
      - left_hand_index_bend_joint
      - left_hand_index_joint1
      - left_hand_index_joint2
      - left_hand_mid_joint1
      - left_hand_mid_joint2
      - left_hand_ring_joint1
      - left_hand_ring_joint2
      - left_hand_pinky_joint1
      - left_hand_pinky_joint2

right_hand_controller:
  ros__parameters:
    joints:
      - right_hand_thumb_bend_joint
      - right_hand_thumb_rota_joint1
      - right_hand_thumb_rota_joint2
      - right_hand_index_bend_joint
      - right_hand_index_joint1
      - right_hand_index_joint2
      - right_hand_mid_joint1
      - right_hand_mid_joint2
      - right_hand_ring_joint1
      - right_hand_ring_joint2
      - right_hand_pinky_joint1
      - right_hand_pinky_joint2
